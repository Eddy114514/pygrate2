<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Pygrate Migration Report</title>

    

    <!-- CodeMirror -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/python/python.min.js"></script>

    <!-- React + ReactDOM + Babel (for JSX in app.js) -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- ANTD UI -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/antd/4.24.13/antd.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/antd/4.24.13/antd.min.js"></script>

    <!-- App styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">



</head>
<body>
    <header>
        <form method="GET" action="/">
            <label>
                Project root: 
                <input type="text" name="root" value="{{ project_root }}">
            </label>
            <label>
                File (relative to root):
                <input type="text" name="file" value="{{ file_path }}">
            </label>
            <button type="submit">Analyze</button>
        </form>
    </header>

    <main>
        <div id="root"></div>
    </main>

    <!-- Initial data for React app -->
    <script>
        window.PYGRATE_DATA = {
            sourceText: {{ source_text|tojson|safe }},
            warnings: {{ warnings_for_js|tojson|safe }}
        };
    </script>

    <!-- React app (JSX compiled by Babel in the browser) -->
    <script type="text/babel" src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
