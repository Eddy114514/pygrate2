<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Pygrate Project Config</title>
    <!-- Legacy template: the maintained UI entrypoint is templates/frontend_shell.html. -->

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<script>
    window.PYGRATE_PROJECT_DATA = {
        engineRoot: {{ engine_root|tojson|safe }},
        projectRoot: {{ project_root|tojson|safe }},
        fileTree: {{ file_tree|tojson|safe }},
    };
</script>

<script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/antd/4.24.13/antd.min.js"></script>
<script type="text/babel" src="{{ url_for('static', filename='project_app.js') }}"></script>


<script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jstree@3.3.12/dist/jstree.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jstree@3.3.12/dist/themes/default/style.min.css" />



<body>
<header>
    <form method="GET" action="{{ url_for('project_view') }}">
        <label>
            Pygrate root (engine):
            <input type="text" name="engine" value="{{ engine_root }}">
        </label>
        <label>
            Project root:
            <input type="text" name="root" value="{{ project_root }}">
        </label>
        <button type="submit">Open</button>
    </form>
</header>

<main>
    <div class="project-container">
        {% if not engine_root or not project_root %}
            <p>Please enter both the Pygrate engine root and the project root, then click <strong>Open</strong>.</p>
        {% else %}
            {% if not file_tree %}
                <p>No .py files found under this project root.</p>
            {% else %}
                <div class="project-layout">
                    <div id="project-root"></div>
                </div>
            {% endif %}
        {% endif %}
    </div>
</main>
</body>
</html>
